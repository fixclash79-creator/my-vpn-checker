
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My VPN Checker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 16px;
  background: #0b1220;
  color: #edf3ff;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 700px;
  margin: auto;
}
h1 { font-size: 28px; }
.subtitle { color: #9cacc3; }
.card {
  background: #152238;
  border: 1px solid #30435d;
  border-radius: 22px;
  padding: 25px;
  margin-top: 22px;
}
.ip {
  font-size: 32px;
  font-weight: bold;
  overflow-wrap: anywhere;
  margin: 18px 0;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.item {
  background: #20314b;
  border-radius: 15px;
  padding: 18px 12px;
  min-width: 0;
}
.item p { color: #9cacc3; margin: 0 0 12px; }
.item strong { overflow-wrap: anywhere; }
button {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 14px;
  background: #3185f5;
  color: white;
  font-size: 18px;
  margin-top: 20px;
}
#status {
  color: #aabbd1;
  margin-top: 15px;
}
footer {
  text-align: center;
  color: #8292a8;
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🌐 My VPN Checker</h1>
  <p class="subtitle">ពិនិត្យ IP និងទីតាំងបណ្តាញរបស់អ្នក</p>

  <div class="card">
    <p>IP Address បច្ចុប្បន្ន</p>
    <div class="ip" id="ip">កំពុងផ្ទុក...</div>
    <p id="status">កំពុងទាញយកទិន្នន័យ...</p>
    <button id="checkBtn" onclick="getIP()">ពិនិត្យ IP ម្តងទៀត</button>
  </div>

  <div class="card grid">
    <div class="item">
      <p>ប្រទេស</p>
      <strong id="country">-</strong>
    </div>
    <div class="item">
      <p>ទីក្រុង</p>
      <strong id="city">-</strong>
    </div>
    <div class="item">
      <p>ISP / ក្រុមហ៊ុន Internet</p>
      <strong id="isp">-</strong>
    </div>
    <div class="item">
      <p>តំបន់</p>
      <strong id="region">-</strong>
    </div>
  </div>

  <footer>IP information powered by ipwho.is</footer>
</div>

<script>
async function getIP() {
  const btn = document.getElementById("checkBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.textContent = "កំពុងពិនិត្យ...";
  status.textContent = "កំពុងទាញយកទិន្នន័យ...";

  try {
    const response = await fetch("https://ipwho.is/");
    if (!response.ok) throw new Error("Network error");

    const data = await response.json();
    if (!data.success) {
      throw new Error(data.message || "API error");
    }

    document.getElementById("ip").textContent =
      data.ip || "មិនមានទិន្នន័យ";

    document.getElementById("country").textContent =
      data.country || "-";

    document.getElementById("city").textContent =
      data.city || "-";

    document.getElementById("isp").textContent =
      data.connection?.isp || "មិនមានទិន្នន័យ";

    document.getElementById("region").textContent =
      data.region || "-";

    status.textContent = "ទទួលបានទិន្នន័យជោគជ័យ ✓";

  } catch (error) {
    status.textContent =
      "មិនអាចទាញយកទិន្នន័យបាន។ សូមព្យាយាមម្តងទៀត។";
    document.getElementById("ip").textContent = "-";
  }

  btn.disabled = false;
  btn.textContent = "ពិនិត្យ IP ម្តងទៀត";
}

getIP();
</script>
</body>
</html>
